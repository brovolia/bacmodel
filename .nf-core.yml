repository_type: pipeline
nf_core_version: 4.0.2
lint:
  multiqc_config: false
  files_unchanged:
    # Custom banner (mascot + wordmark) reused as the metro-map legend logo too -
    # see docs/dev/metro_map.md. Must not be reverted to the template placeholder.
    - docs/images/nf-core-bacmodel_logo_light.png
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - assets/multiqc_config.yml
  template_strings: false
  nextflow_config:
    # These three default to "${projectDir}/assets/<tool>_db" in nextflow.config, so they
    # resolve to an absolute, checkout-specific path - can never literally string-match a
    # static default in nextflow_schema.json (used there only for documentation purposes).
    - config_defaults:
        - params.baktadb
        - params.pfamdb
        - params.macsyfinder_db
template:
  org: nf-core
  name: bacmodel
  description: Systems-based bacterial functional modeling pipeline
  author: Olga Brovkina
  version: 1.0.0
  force: true
  outdir: .
  skip_features:
    - igenomes
    - multiqc
    - fastqc
    - gpu
  is_nfcore: true
