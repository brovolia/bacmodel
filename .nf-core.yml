repository_type: pipeline
nf_core_version: 4.1.0
lint:
  multiqc_config: false
  files_unchanged:
    # Custom banner (mascot + wordmark) reused as the metro-map legend logo too -
    # see .github/CONTRIBUTING.md ("Images and figures"). Must not be reverted to
    # the template placeholder.
    - docs/images/nf-core-bacmodel_logo_light.png
    - .prettierignore
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - assets/multiqc_config.yml
  template_strings: false
  nextflow_config:
template:
  org: nf-core
  name: bacmodel
  description: Systems-based bacterial functional modeling pipeline
  author: Olga Brovkina
  version: 1.0.0
  force: true
  outdir: .
  skip_features:
    - igenomes
    - multiqc
    - fastqc
    - gpu
  is_nfcore: true
