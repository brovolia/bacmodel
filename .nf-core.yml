repository_type: pipeline
nf_core_version: 4.0.2
lint:
  # files_unchanged disabled due to nf-core/tools 4.0.2 bug:
  # JSONDecodeError in try_generate_container_configs() when Nextflow 26.x
  # outputs non-JSON lines (e.g. "[PIPELINE]") to stdout during `nextflow inspect`.
  # Re-enable once nf-core/tools fixes the except clause (should catch JSONDecodeError).
  files_unchanged: false
  multiqc_config: false
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - assets/multiqc_config.yml
    - .github/workflows/linting_comment.yml
  template_strings: false
  container_configs: false
template:
  org: nf-core
  name: bacmodel
  description: Systems-based bacterial functional modeling pipeline
  author: Olga Brovkina
  version: 1.0.0
  force: true
  outdir: .
  skip_features:
    - igenomes
    - multiqc
    - fastqc
    - gpu
  is_nfcore: true
