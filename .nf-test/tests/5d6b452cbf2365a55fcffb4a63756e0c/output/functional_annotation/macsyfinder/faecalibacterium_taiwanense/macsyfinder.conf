[base]
db_type = unordered
idx = False
replicon_topology = circular
sequence_db = faecalibacterium_taiwanense.faa
[models_opt]
[models]
models = TXSS all
[hmmer]
coverage_profile = 0.5
e_value_search = 0.1
cut_ga = True
i_evalue_sel = 0.001
hmmer = /usr/local/bin/hmmsearch
[score_opt]
mandatory_weight = 1.0
accessory_weight = 0.5
neutral_weight = 0.0
exchangeable_weight = 0.8
itself_weight = 1.0
redundancy_penalty = 1.5
out_of_cluster_weight = 0.7
[directories]
models_dir = models
system_models_dir = /usr/local/share/macsyfinder/models
out_dir = faecalibacterium_taiwanense
profile_suffix = .hmm
res_search_dir = .
res_search_suffix = .search_hmm.out
res_extract_suffix = .res_hmm_extract
[general]
log_file = macsyfinder.log
log_level = 20
relative_path = False
verbosity = 0
quiet = 0
mute = False
worker = 4
timeout = 0
force_run = False

