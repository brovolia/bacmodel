# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "bacmodel_summary"
description: Aggregate results from all functional annotation and metabolic modeling tools into a summary table
keywords:
  - summary
  - aggregation
  - functional annotation
  - metabolic modeling
tools:
  - pandas:
      description: Python data analysis toolkit
      homepage: https://pandas.pydata.org/
      documentation: https://pandas.pydata.org/docs/
      tool_dev_url: https://github.com/pandas-dev/pandas
      licence: ["BSD-3-Clause"]

input:
  - sample_ids:
      type: list
      description: List of sample identifiers
  - macsyfinder_results:
      type: file
      description: MacSyFinder all_systems.tsv files
      pattern: "*/all_systems.tsv"
  - traitar_majority_results:
      type: file
      description: TRAITAR majority-vote prediction files
      pattern: "*/predictions_majority-vote_combined.txt"
  - traitar_single_results:
      type: file
      description: TRAITAR single-vote prediction files
      pattern: "*/predictions_single-votes_combined.txt"
  - carveme_models:
      type: file
      description: CarveMe metabolic model XML files
      pattern: "*.xml"
  - gapseq_models:
      type: file
      description: Gapseq metabolic model RDS files
      pattern: "*-all.RDS"
  - gapseq_tbls:
      type: file
      description: Gapseq pathway and transporter table files
      pattern: "*.tbl"
  - run_macsyfinder:
      type: boolean
      description: Flag indicating if MacSyFinder was run
  - run_traitar:
      type: boolean
      description: Flag indicating if TRAITAR was run
  - run_carveme:
      type: boolean
      description: Flag indicating if CarveMe was run
  - run_gapseq:
      type: boolean
      description: Flag indicating if Gapseq was run

output:
  - tsv:
      type: file
      description: Summary table with results from all enabled tools
      pattern: "bacmodel_summary.tsv"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@brovolia"
maintainers:
  - "@brovolia"
